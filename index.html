/* ---------- shared components ---------- */
function Reveal({ children, delay = 0, className = "" }) {
  const ref = useRef(null);
  const [vis, setVis] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setVis(true); io.disconnect(); } }, { threshold: 0.12, rootMargin: "0px 0px -40px 0px" });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return <div ref={ref} style={{ transitionDelay: `${delay}ms` }} className={`reveal ${vis ? "revealed" : ""} ${className}`}>{children}</div>;
}

function Eyebrow({ children, light = false }) {
  return (
    <div className={`flex items-center gap-3 text-[11px] font-semibold uppercase tracking-[0.22em] ${light ? "text-clay" : "text-clay"}`}>
      <span className="h-px w-8 bg-clay/60"></span>
      {children}
    </div>
  );
}

function ScrollProgress() {
  const [w, setW] = useState(0);
  useEffect(() => {
    const fn = () => {
      const h = document.documentElement.scrollHeight - window.innerHeight;
      setW(h > 0 ? (window.scrollY / h) * 100 : 0);
    };
    fn();
    window.addEventListener("scroll", fn, { passive: true });
    window.addEventListener("resize", fn);
    return () => { window.removeEventListener("scroll", fn); window.removeEventListener("resize", fn); };
  }, []);
  return <div className="scroll-progress" style={{ width: w + "%" }} aria-hidden="true"></div>;
}

function Btn({ href = "#", variant = "clay", children, className = "", onClick }) {
  const base = "btn-shine group inline-flex items-center justify-center gap-2 rounded-full px-7 py-3.5 text-sm font-medium transition-all duration-300 focus:outline-none focus-visible:ring-2 focus-visible:ring-clay/60 active:scale-[0.98]";
  const variants = {
    clay: "bg-clay text-cream hover:bg-clay-deep shadow-[0_10px_30px_-12px_rgba(192,90,51,0.55)]",
    dark: "bg-espresso text-cream hover:bg-cocoa",
    outline: "border border-espresso/25 text-espresso hover:border-espresso hover:bg-espresso hover:text-cream",
    light: "bg-cream text-espresso hover:bg-white",
    ghostlight: "border border-cream/30 text-cream hover:bg-cream hover:text-espresso"
  };
  return (
    <a href={href} onClick={onClick} className={`${base} ${variants[variant]} ${className}`}>
      {children}
    </a>
  );
}

/* ---------- 1. NAVIGATION ---------- */
function Navbar() {
  const [scrolled, setScrolled] = useState(false);
  const [open, setOpen] = useState(false);
  useEffect(() => {
    const fn = () => setScrolled(window.scrollY > 24);
    fn();
    window.addEventListener("scroll", fn, { passive: true });
    return () => window.removeEventListener("scroll", fn);
  }, []);
  useEffect(() => {
    document.body.style.overflow = open ? "hidden" : "";
  }, [open]);
  const links = [
    { label: "Explore", href: "#explore" },
    { label: "How It Works", href: "#how" },
    { label: "For Businesses", href: "#business" },
    { label: "About Bocxy", href: "#about" }
  ];
  return (
    <header className={`fixed inset-x-0 top-0 z-50 transition-all duration-500 ${scrolled ? "bg-cream/85 backdrop-blur-xl shadow-[0_1px_0_rgba(34,24,18,0.08)]" : "bg-transparent"}`}>
      <nav className="mx-auto flex h-[72px] max-w-7xl items-center justify-between px-6 md:px-10" aria-label="Main navigation">
        <Logo />
        <div className="hidden items-center gap-9 lg:flex">
          {links.map(l => (
            <a key={l.label} href={l.href} className="navlink text-sm text-espresso/70 hover:text-espresso">{l.label}</a>
          ))}
        </div>
        <div className="hidden items-center gap-3 lg:flex">
          <a href="#business" className="text-sm font-medium text-espresso/80 hover:text-espresso transition-colors">For Businesses</a>
          <a href="#salons" className="inline-flex items-center gap-2 rounded-full bg-espresso px-6 py-3 text-sm font-medium text-cream transition-all duration-300 hover:bg-cocoa hover:shadow-lift">
            Book an Appointment
            <Icon.Arrow c="h-4 w-4 transition-transform duration-300 group-hover:translate-x-0.5" />
          </a>
        </div>
        <button onClick={() => setOpen(!open)} className="rounded-full p-2.5 text-espresso transition-colors hover:bg-espresso/5 lg:hidden" aria-label={open ? "Close menu" : "Open menu"} aria-expanded={open}>
          {open ? <Icon.X c="h-6 w-6" /> : <Icon.Menu c="h-6 w-6" />}
        </button>
      </nav>
      {open && (
        <div className="fixed inset-x-0 top-[72px] bottom-0 z-40 overflow-y-auto bg-cream px-6 pb-10 pt-6 lg:hidden">
          <div className="flex flex-col gap-2">
            {links.map((l, i) => (
              <a key={l.label} href={l.href} onClick={() => setOpen(false)} className="border-b border-espresso/10 py-5 font-serif text-3xl text-espresso transition-colors hover:text-clay" style={{ transitionDelay: `${i * 40}ms` }}>
                {l.label}
              </a>
            ))}
          </div>
          <div className="mt-8 flex flex-col gap-3">
            <a href="#salons" onClick={() => setOpen(false)} className="inline-flex items-center justify-center gap-2 rounded-full bg-clay px-6 py-4 text-sm font-medium text-cream">Book an Appointment</a>
            <a href="#business" onClick={() => setOpen(false)} className="inline-flex items-center justify-center gap-2 rounded-full border border-espresso/20 px-6 py-4 text-sm font-medium text-espresso">For Businesses</a>
          </div>
        </div>
      )}
    </header>
  );
}
