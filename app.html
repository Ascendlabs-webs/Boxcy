function Reveal({ children, delay = 0, className = "", big = false, as = "div" }) {
  const ref = useRef(null);
  const [vis, setVis] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { setVis(true); io.disconnect(); }
    }, { threshold: 0.12, rootMargin: "0px 0px -60px 0px" });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  const Tag = as;
  return <Tag ref={ref} style={{ transitionDelay: `${delay}ms` }} className={`${big ? "reveal-2" : "reveal"} ${vis ? "revealed" : ""} ${className}`}>{children}</Tag>;
}

function Eyebrow({ children, light = false }) {
  return (

      <span className="h-px w-8 bg-clay"></span>
      <span>{children}</span>
    </div>
  );
}

function Btn({ children, variant = "clay", className = "", as = "a", href = "#", onClick }) {
  const Tag = as;
  const base = "group inline-flex items-center justify-center gap-2.5 rounded-full px-7 py-3.5 text-sm font-medium transition-all duration-300 focus:outline-none focus-visible:ring-2 focus-visible:ring-clay/60 active:scale-[0.98]";
  const variants = {
    clay: "bg-clay text-cream hover:bg-clay-deep hover:shadow-[0_12px_32px_-12px_rgba(181,86,47,0.6)]",
    dark: "bg-ink text-cream hover:bg-charcoal",
    cream: "bg-cream text-ink hover:bg-bone border border-ink/10",
    outline: "border border-ink/30 text-ink hover:border-ink hover:bg-ink hover:text-cream",
    ghostlight: "border border-cream/30 text-cream hover:bg-cream hover:text-ink"
  };
  return <Tag href={href} onClick={onClick} className={`${base} ${variants[variant]} ${className}`}>{children}</Tag>;
}

  );
}

function useCountUp(target, duration = 1400, start = false) {
  const [n, setN] = useState(0);
  useEffect(() => {
    if (!start) return;
    let raf;
    const t0 = performance.now();
    const tick = (now) => {
      const p = Math.min(1, (now - t0) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      setN(Math.floor(eased * target));
      if (p < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [target, duration, start]);
  return n;
}

function useRoute() {
  const [path, setPath] = useState(window.location.hash.replace(/^#/, "") || "/");
  useEffect(() => {
    const onChange = () => setPath(window.location.hash.replace(/^#/, "") || "/");
    window.addEventListener("hashchange", onChange);
    return () => window.removeEventListener("hashchange", onChange);
  }, []);
  const nav = useCallback((to) => { window.location.hash = to; window.scrollTo({ top: 0, behavior: "instant" }); }, []);
  return [path, nav];
}

function ScrollProgress() {
  const [w, setW] = useState(0);
  useEffect(() => {
    const fn = () => {
      const h = document.documentElement.scrollHeight - window.innerHeight;
      setW(h > 0 ? (window.scrollY / h) * 100 : 0);
    };
    fn();
    window.addEventListener("scroll", fn, { passive: true });
    window.addEventListener("resize", fn);
    return () => { window.removeEventListener("scroll", fn); window.removeEventListener("resize", fn); };
  }, []);
  return <div className="scroll-progress" style={{ width: w + "%" }} aria-hidden="true"></div>;
}

function SideToc({ items }) {
  const [active, setActive] = useState(items[0]?.id || "");
  useEffect(() => {
    const els = items.map(i => document.getElementById(i.id)).filter(Boolean);
    if (!els.length) return;
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) setActive(e.target.id); });
    }, { rootMargin: "-40% 0px -50% 0px" });
    els.forEach(el => io.observe(el));
    return () => io.disconnect();
  }, [items]);
  return (
    <nav aria-label="On this page" className="pointer-events-none fixed right-8 top-1/2 z-30 hidden -translate-y-1/2 lg:block">
      <ul className="pointer-events-auto space-y-3 text-right">
          {items.map(i => (
            <li key={i.id}>
              <a href={`#${i.id}`} className={`group inline-flex items-center gap-3 transition-all ${active === i.id ? "text-ink" : "text-taupe/50 hover:text-taupe"}`}>
                <span className={`text-[10px] font-mono uppercase tracking-wider transition-all ${active === i.id ? "opacity-100" : "opacity-0 group-hover:opacity-100"}`}>{String(items.indexOf(i) + 1).padStart(2, "0")}</span>
                <span className={`h-px transition-all ${active === i.id ? "w-10 bg-ink" : "w-5 bg-current"}`}></span>
                <span className="text-[11px] font-medium">{i.label}</span>
              </a>
            </li>
          ))}
        </ul>
    </nav>
  );
}

function Counter({ to, suffix = "" }) {
  const [ref, setRef] = useState(null);
  const [vis, setVis] = useState(false);
  useEffect(() => {
    if (!ref) return;
    const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setVis(true); io.disconnect(); } }, { threshold: 0.3 });
    io.observe(ref);
    return () => io.disconnect();
  }, [ref]);
  const n = useCountUp(to, 1600, vis);
  return <span ref={setRef} className="num">{n.toLocaleString()}{suffix}</span>;
}

                  <div className="aspect-[4/5] overflow-hidden rounded-3xl shadow-lift">
                    <img src={IMG.story} alt="" className="h-full w-full object-cover" loading="lazy" />
                  </div>
                  <div className="animate-floaty absolute -bottom-6 -left-6 hidden rounded-2xl bg-paper p-5 shadow-lift sm:block">
                    <div className="text-[10px] font-semibold uppercase tracking-wider text-taupe">Founded</div>
                    <div className="mt-1 font-serif text-2xl font-medium">2023 · Chennai</div>
                  </div>
                </div>
              </Reveal>
            </div>
          </div>
        </div>
      </section>

      <section className="bg-cream/40 py-24 md:py-32">
        <div className="mx-auto max-w-[1400px] px-6 md:px-12">
          <div className="grid gap-14 lg:grid-cols-12">
            <div className="lg:col-span-4">
              <Reveal><Eyebrow>Our values</Eyebrow></Reveal>
              <Reveal delay={120}><h2 className="mt-6 font-serif text-5xl font-light leading-tight tracking-tighter sm:text-6xl">Quiet principles<br />for a loud industry.</h2></Reveal>
            </div>
            <div className="space-y-px overflow-hidden rounded-3xl border border-ink/10 bg-ink/10 lg:col-span-8">
              {[
                { n: "01", t: "Calm over hype", d: "Beauty isn't a content vertical. It's your time, your ritual, your day. We design every screen to get out of the way." },
                { n: "02", t: "Craft over scale", d: "We partner with people who do their craft seriously. We verify, we curate, we say no when something isn't right." },
                { n: "03", t: "People over metrics", d: "We measure success by repeat customers and show-up rates — not viral hits. Beauty is local, and so are we." },
                { n: "04", t: "Honesty over gloss", d: "Real photos, real prices, real reviews. No fake discounts, no inflated ratings, no theatre." }
              ].map((v, i) => (
                <Reveal key={v.n} delay={i * 80}>
                  <div className="bg-paper p-8 transition-colors hover:bg-cream">
                    <div className="flex items-baseline gap-4">
                      <span className="font-serif text-2xl italic text-clay">{v.n}</span>
                      <h3 className="font-serif text-2xl font-medium">{v.t}</h3>
                    </div>
                    <p className="mt-3 max-w-2xl text-sm leading-relaxed text-ink/65">{v.d}</p>
                  </div>
                </Reveal>
              ))}
            </div>
          </div>
        </div>
      </section>

      <section className="bg-paper py-24 md:py-32">
        <div className="mx-auto max-w-[1400px] px-6 md:px-12">
          <div className="grid gap-12 sm:grid-cols-3">
            <Reveal><Stat value="2023" label="Founded" /></Reveal>
            <Reveal delay={100}><Stat value="100" label="Partner Salons" /></Reveal>
            <Reveal delay={200}><Stat value="500" label="Independent Pros" /></Reveal>
          </div>
        </div>
      </section>

      <section className="bg-ink py-24 text-cream md:py-32">
        <div className="mx-auto max-w-[1400px] px-6 md:px-12">
          <Reveal><Eyebrow light>Press</Eyebrow></Reveal>
          <Reveal delay={120}><h2 className="mt-6 font-serif text-5xl font-light leading-tight tracking-tighter sm:text-7xl">Quietly noticed.</h2></Reveal>
          <div className="mt-14 flex flex-wrap items-center gap-x-14 gap-y-6">
            {PRESS.map(p => <span key={p} className="font-serif text-2xl italic text-cream/55">{p}</span>)}
          </div>
        </div>
      </section>

      <section className="bg-paper py-24 md:py-32">
        <div className="mx-auto max-w-3xl px-6 md:px-12">
          <Reveal><Eyebrow>FAQ</Eyebrow></Reveal>
          <Reveal delay={120}><h2 className="mt-6 font-serif text-5xl font-light leading-tight tracking-tighter sm:text-6xl">Common questions,<br /><em className="italic text-clay">quiet answers.</em></h2></Reveal>
          <div className="mt-12 space-y-px overflow-hidden rounded-3xl border border-ink/10 bg-ink/10">
            {FAQS.map((f, i) => <FaqItem key={f.q} item={f} delay={i * 60} />)}
          </div>
        </div>
      </section>
    </>
  );
}

function FaqItem({ item, delay }) {
  const [open, setOpen] = useState(false);
  return (
    <Reveal delay={delay}>
      <div className="bg-paper">
        <button onClick={() => setOpen(!open)} className="flex w-full items-center justify-between gap-6 p-6 text-left transition-colors hover:bg-cream">
          <span className="font-serif text-xl font-medium">{item.q}</span>
          <span className={`flex h-8 w-8 shrink-0 items-center justify-center rounded-full border border-ink/15 text-ink transition-all ${open ? "rotate-45 bg-ink text-cream" : ""}`}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" className="h-3.5 w-3.5"><path d="M12 5v14M5 12h14" strokeLinecap="round"/></svg>
          </span>
        </button>
        {open && <div className="px-6 pb-6 text-sm leading-relaxed text-ink/70">{item.a}</div>}
      </div>
    </Reveal>
  );
}

function JournalPage() {
  return (
    <>
      <section className="relative overflow-hidden bg-paper pt-[120px]">
        <div className="pointer-events-none absolute -right-40 -top-40 h-[520px] w-[520px] rounded-full bg-clay/8 blur-3xl"></div>
        <div className="mx-auto max-w-[1400px] px-6 pb-20 md:px-12 md:pb-28">
          <Reveal><Eyebrow>The Journal</Eyebrow></Reveal>
          <Reveal delay={120} big><h1 className="mt-6 font-serif text-6xl font-light leading-[0.96] tracking-tighter sm:text-8xl">Notes on craft,<br /><em className="italic text-clay">ritual & taste.</em></h1></Reveal>
          <Reveal delay={240}><p className="mt-8 max-w-xl font-serif text-xl italic leading-relaxed text-ink/65">Long-form, photographed features and field notes from the people shaping India's new beauty economy.</p></Reveal>
        </div>
      </section>
      <section className="bg-paper pb-24">
        <div className="mx-auto max-w-[1400px] px-6 md:px-12">
          <div className="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
            {JOURNAL.map((j, i) => (
              <Reveal key={j.title} delay={i * 100}>
                <a href="#/journal" className="group block">
                  <article className="overflow-hidden rounded-3xl border border-ink/10 transition-all duration-500 hover:-translate-y-1 hover:shadow-lift">
                    <div className="relative aspect-[4/5] overflow-hidden">
                      <img src={j.img} alt="" className="h-full w-full object-cover transition-transform duration-[1.4s] ease-out group-hover:scale-[1.06]" loading="lazy" />
                    </div>
                    <div className="p-6">
                      <div className="text-[10px] font-semibold uppercase tracking-[0.22em] text-clay">{j.kicker}</div>
                      <h3 className="mt-3 font-serif text-2xl font-medium leading-snug transition-colors group-hover:text-clay">{j.title}</h3>
                      <div className="mt-4 flex items-center gap-2 text-[11px] text-taupe">
                        <span className="h-px w-6 bg-ink/15"></span>
                        <span>{j.read} read</span>
                      </div>
                    </div>
                  </article>
                </a>
              </Reveal>
            ))}
          </div>
        </div>
      </section>
    </>
  );
}

/* =========================================================
   ROUTER ROOT
   ========================================================= */
function App() {
  const [route, nav] = useRoute();
  let page;
  let toc = null;
  if (route.startsWith("/discover")) page = <DiscoverPage />;
  else if (route.startsWith("/business")) page = <BusinessPage />;
  else if (route.startsWith("/about")) page = <AboutPage />;
  else if (route.startsWith("/journal")) page = <JournalPage />;
  else if (route.startsWith("/products")) page = <ProductsPage />;
  else {
    page = <HomePage />;
    toc = (
      <SideToc items={[
        { id: "top", label: "Hero" },
        { id: "products", label: "Suite" },
        { id: "explore", label: "Categories" },
        { id: "salons", label: "Featured" },
        { id: "index", label: "Salon Index" },
        { id: "try", label: "Try Booking" },
        { id: "map", label: "In Chennai" },
        { id: "download", label: "App" }
      ]} />
    );
  }
  return (
    <div className="min-h-screen bg-paper font-sans text-ink">
      <ScrollProgress />
      <Navbar route={route} nav={nav} />
      <main key={route}>{page}</main>
      {toc}
      <Footer />
      <MobileCta />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
